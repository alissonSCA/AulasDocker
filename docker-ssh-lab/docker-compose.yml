version: '3.8'

services:
  # Serviço base para todas as VMs
  team-base:
    build: .
    image: docker-ssh-lab:latest
    restart: unless-stopped
    # profiles com um nome que nunca é ativado: isso impede que o
    # "docker compose up" (sem argumentos) suba este serviço como um
    # 11º container por conta própria. Ele existe só para ser herdado
    # via "extends" pelos serviços teamNN abaixo — sem esta linha, o
    # Compose sobe "team-base" também (sem portas nem volumes,
    # inutilizável), o que não bate com os "10 VMs" do README e
    # desperdiça recursos.
    profiles: ["nao-iniciar-diretamente"]
    networks:
      - lab-network

  # 10 VMs para as equipes
  team01:
    extends:
      service: team-base
    container_name: team01-vm
    hostname: team01-vm
    ports:
      - "2201:22"
    environment:
      - TEAM_NUMBER=01
      - TEAM_PASSWORD=team01pass
    volumes:
      - ./data/team01:/home/team01/workspace
      - ./logs/team01:/var/log/team01

  team02:
    extends:
      service: team-base
    container_name: team02-vm
    hostname: team02-vm
    ports:
      - "2202:22"
    environment:
      - TEAM_NUMBER=02
      - TEAM_PASSWORD=team02pass
    volumes:
      - ./data/team02:/home/team02/workspace
      - ./logs/team02:/var/log/team02

  team03:
    extends:
      service: team-base
    container_name: team03-vm
    hostname: team03-vm
    ports:
      - "2203:22"
    environment:
      - TEAM_NUMBER=03
      - TEAM_PASSWORD=team03pass
    volumes:
      - ./data/team03:/home/team03/workspace
      - ./logs/team03:/var/log/team03

  team04:
    extends:
      service: team-base
    container_name: team04-vm
    hostname: team04-vm
    ports:
      - "2204:22"
    environment:
      - TEAM_NUMBER=04
