# "x-team-base" é um "extension field" (prefixo x-): o Docker Compose
# ignora completamente qualquer chave de topo que comece com "x-" como
# definição de serviço — ele nunca tenta subir isso sozinho. Serve só
# como modelo, reaproveitado pelos serviços teamNN abaixo via YAML
# merge key ("<<: *team-base").
#
# Isso substitui a abordagem anterior (um serviço "team-base" real +
# "extends"), que tinha um problema sério: "extends" copia TODA a
# configuração do serviço base para quem usa, inclusive coisas como
# "profiles" — então qualquer tentativa de esconder "team-base" do
# "docker compose up" padrão com profiles acabava escondendo também
# as 10 equipes (sintoma: "no service selected", nada sobe). Com
# "x-team-base" isso não existe: não é um serviço, não tem profile
# nenhum para herdar, e nunca aparece em "docker compose ps".
x-team-base: &team-base
  build: .
  image: docker-intro-lab:latest
  restart: unless-stopped
  # privileged é o que permite rodar Docker DENTRO deste container
  # (Docker-in-Docker) — sem isso "sudo apt install docker.io" até
  # funciona, mas o daemon nunca sobe.
  privileged: true
  # cgroup: host ajuda o Docker aninhado a enxergar os cgroups do host
  # em máquinas com cgroup v2 (padrão em distros recentes, incluindo
  # Pop!_OS). Se o seu "docker compose" reclamar dessa chave (versão
  # antiga do Compose), pode apagar esta linha em cada serviço — ver
  # README.md, seção Troubleshooting.
  cgroup: host
  networks:
    - lab-network

services:
  # 10 VMs para as equipes
  team01:
    <<: *team-base
    container_name: team01-intro-vm
    hostname: team01-vm
    ports:
      - "2201:22"
      - "8301:8080"
    environment:
      - TEAM_NUMBER=01
      - TEAM_PASSWORD=team01pass
    volumes:
      - ./sites/team01:/home/team01/site
      - team01_docker_data:/var/lib/docker

  team02:
